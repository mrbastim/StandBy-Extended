name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release metadata checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Run unit tests (retry transient Robolectric downloads)
        run: python3 .github/scripts/retry_robolectric_tests.py

      - name: Lint and assemble
        run: ./gradlew lintDebug assembleDebug assembleRelease

      - name: Upload installable PR APK
        if: github.event_name == 'pull_request'
        id: pr-apk
        uses: actions/upload-artifact@v4
        with:
          name: standbymode-pr-${{ github.event.number }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Add APK download to the job summary
        if: github.event_name == 'pull_request'
        env:
          APK_URL: ${{ steps.pr-apk.outputs.artifact-url }}
        run: printf '[Download the debug APK (ZIP)](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  smoke:
    needs: verify
    uses: ./.github/workflows/release-smoke.yml

name: Build and publish dev prerelease

on:
  push:
    branches: [dev]

permissions:
  contents: read

# Every push builds independently. Signing never executes repository build code.
jobs:
  build:
    if: github.repository == 'mrbastim/StandByMode'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and assemble without release secrets
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  smoke:
    needs: build
    uses: ./.github/workflows/release-smoke.yml

  publish:
    needs: [build, smoke]
    # Defense in depth; actual branch access must be restricted in repository settings.
    if: github.actor == 'mrbastim'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-apk.yml
    # Explicit forwarding is required even for secrets resolved by the callee's environment.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    with:
      development: true
      target-sha: ${{ github.sha }}

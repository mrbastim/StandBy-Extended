name: Build and publish dev prerelease

on:
  push:
    branches: [dev]

permissions:
  contents: read

# Every push (including a merge) gets its own run and immutable prerelease tag.
# Do not cancel earlier runs when another commit reaches dev.
jobs:
  prerelease:
    if: github.repository == 'mrbastim/StandBy-Extended'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Required GitHub secret is missing: $secret_name" >&2
              exit 1
            fi
          done

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/dev-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Test, lint and build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Name development APK
        run: cp app/build/outputs/apk/release/app-release.apk StandBy-dev.apk

      - name: Save signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandBy-dev-${{ github.sha }}
          path: StandBy-dev.apk
          if-no-files-found: error

      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk_path="StandBy-dev.apk"
          test -f "$apk_path"
          short_sha="${GITHUB_SHA:0:7}"
          tag="dev-${GITHUB_RUN_NUMBER}-$short_sha"
          title="Development build #${GITHUB_RUN_NUMBER} ($short_sha)"
          notes="Automated development build from dev. Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA. Tests and lint passed. This prerelease does not change the stable Latest release."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease --latest=false --title "$title" --notes "$notes"
            gh release upload "$tag" "$apk_path" --clobber
          else
            gh release create "$tag" "$apk_path" --target "$GITHUB_SHA" --prerelease --latest=false --title "$title" --notes "$notes"
          fi

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dev-release-key.jks"

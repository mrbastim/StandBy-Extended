name: Minified release startup

on:
  workflow_call:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      # No checkout and no production signing secrets in the APK execution job.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release
          path: incoming
      - name: Sign minified APK with disposable test key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -dname "CN=CI smoke" -keyalg RSA -validity 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --key-pass pass:android --out smoke.apk incoming/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/smoke.jks"
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Launch minified Activity and DreamService (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The action executes each physical script line in its own shell.
          # Keep the complete test in one folded command.
          script: >-
            set -eu;
            adb install smoke.apk;
            for attempt in 1 2; do
            adb logcat -c;
            adb shell am force-stop com.mrbastim.standby.extended;
            adb shell am start -W -n com.mrbastim.standby.extended/.MainActivity;
            sleep 5;
            app_pid="$(adb shell pidof com.mrbastim.standby.extended | tr -d '\r')";
            test -n "$app_pid";
            adb logcat -d --pid="$app_pid" -s AndroidRuntime:E > runtime.log;
            if grep -Eq 'FATAL EXCEPTION|LocalLifecycleOwner not present' runtime.log; then
            cat runtime.log; exit 1;
            fi;
            done;
            if [ "${{ matrix.api-level }}" -ge 35 ]; then
            adb shell am force-stop com.mrbastim.standby.extended;
            adb shell settings put secure screensaver_enabled 1;
            adb shell settings put secure screensaver_components com.mrbastim.standby.extended/.StandByDreamService;
            adb shell settings put system accelerometer_rotation 0;
            adb shell settings put system user_rotation 1;
            adb logcat -c;
            adb root;
            adb wait-for-device;
            if [ "$(adb shell id -u | tr -d '\r')" != "0" ]; then
            echo "API 35 Google APIs emulator did not grant ADB root" >&2; exit 1;
            fi;
            adb shell cmd dreams start-dreaming;
            sleep 8;
            adb shell dumpsys dreams > dream-state.log;
            if ! grep -E 'mCurrentDream=DreamRecord.*StandByDreamService' dream-state.log; then
            cat dream-state.log; adb logcat -d -s AndroidRuntime:E; exit 1;
            fi;
            test -n "$(adb shell pidof com.mrbastim.standby.extended | tr -d '\r')";
            adb logcat -d -s AndroidRuntime:E > dream-runtime.log;
            if grep -Eq 'FATAL EXCEPTION|LocalLifecycleOwner not present' dream-runtime.log; then
            cat dream-runtime.log; exit 1;
            fi;
            fi

name: Minified release startup

on:
  workflow_call:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No checkout and no production signing secrets in the APK execution job.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release
          path: incoming
      - name: Sign minified APK with disposable test key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -dname "CN=CI smoke" -keyalg RSA -validity 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --key-pass pass:android --out smoke.apk incoming/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/smoke.jks"
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Launch minified Activity twice on minSdk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The action executes each physical script line in its own shell.
          # Fold the loop into one command so its variables and control flow share a shell.
          script: >-
            set -eu;
            adb install smoke.apk;
            for attempt in 1 2; do
            adb shell am force-stop com.mrbastim.standby.extended;
            adb shell am start -W -n com.mrbastim.standby.extended/.MainActivity;
            sleep 5;
            app_pid="$(adb shell pidof com.mrbastim.standby.extended | tr -d '\r')";
            test -n "$app_pid";
            adb logcat -d --pid="$app_pid" -s AndroidRuntime:E > runtime.log;
            if grep -Eq 'FATAL EXCEPTION|LocalLifecycleOwner not present' runtime.log; then
            cat runtime.log; exit 1;
            fi;
            done

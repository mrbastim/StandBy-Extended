name: Sign and publish APK

on:
  workflow_call:
    inputs:
      development:
        type: boolean
        required: true
      target-sha:
        type: string
        required: true
      release-tag:
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  sign:
    if: github.repository_id == '1457038002' && github.repository_owner == 'mrbastim' && github.actor == 'mrbastim'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.current.outputs.publish }}
    steps:
      # Deliberately no checkout, Gradle, project scripts, caches or APK execution here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release
          path: incoming
      - name: Skip outdated development builds
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEVELOPMENT: ${{ inputs.development }}
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          if [[ "$DEVELOPMENT" == "true" ]]; then
            head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')"
            if [[ "$head_sha" != "$TARGET_SHA" ]]; then
              echo "Skipping superseded development commit $TARGET_SHA"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Sign APK using the protected environment
        if: steps.current.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEVELOPMENT: ${{ inputs.development }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Required signing secret is missing: $secret_name" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/release-key.jks"
          trap 'rm -f "$keystore_path"' EXIT
          # Accept wrapped/CRLF clipboard input without ignoring other invalid characters.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_path"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid base64. Encode the original .jks/.keystore file, not its filename or password." >&2
            exit 1
          fi
          apk_name="standbymode.apk"
          if [[ "$DEVELOPMENT" == "true" ]]; then apk_name="standbymode-dev.apk"; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keystore_path" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$apk_name" incoming/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk_name"
      - uses: actions/upload-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: standbymode-signed-${{ github.sha }}
          path: standbymode*.apk
          if-no-files-found: error
  publish:
    needs: sign
    if: needs.sign.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: apk-publish-${{ github.repository }}-${{ inputs.development && 'dev' || inputs.release-tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Only the signed artifact crosses the job boundary.
      - uses: actions/download-artifact@v4
        with:
          name: standbymode-signed-${{ github.sha }}
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEVELOPMENT: ${{ inputs.development }}
          TARGET_SHA: ${{ inputs.target-sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [[ "$DEVELOPMENT" == "true" ]]; then
            # Recheck after SDK setup/signing: a newer push may have arrived meanwhile.
            head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')"
            if [[ "$head_sha" != "$TARGET_SHA" ]]; then
              echo "Skipping superseded development commit $TARGET_SHA"
              exit 0
            fi
            short_sha="${TARGET_SHA:0:7}"
            tag="dev"
            title="Development build ($short_sha)"
            notes="Rolling development prerelease; its APK and tag are replaced after successful checks. Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$TARGET_SHA. Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Tests, lint and minified startup smoke check passed."
            if existing_prerelease="$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease' 2>/dev/null)"; then
              if [[ "$existing_prerelease" != "true" ]]; then
                echo "Refusing to replace a stable release tagged $tag" >&2
                exit 1
              fi
              # Keep the last tested tag if uploading the new APK fails.
              gh release upload "$tag" standbymode-dev.apk --clobber
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$TARGET_SHA" -F force=true --silent
              gh release edit "$tag" --prerelease --latest=false --title "$title" --notes "$notes"
            else
              if tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/dev" --jq '.object.sha' 2>/dev/null)"; then
                if [[ "$tag_sha" != "$TARGET_SHA" ]]; then
                  gh api --method PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$TARGET_SHA" -F force=true --silent
                fi
              else
                gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/dev" -f sha="$TARGET_SHA" --silent
              fi
              gh release create "$tag" standbymode-dev.apk --verify-tag --prerelease --latest=false --title "$title" --notes "$notes"
            fi
            # Owner-approved migration: remove only these four old prereleases.
            # Keep source tags, stable releases and any unrelated publications.
            for legacy_tag in dev-1-ffae1ad dev-2-f5a5cd5 dev-3-03a3f22 dev-4-40441d0; do
              legacy_prerelease="$(gh release view "$legacy_tag" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || true)"
              if [[ "$legacy_prerelease" == "true" ]]; then
                gh release delete "$legacy_tag" --yes
              fi
            done
          else
            [[ "$RELEASE_TAG" == v* ]]
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" standbymode.apk --clobber
            else
              if [[ "$RELEASE_TAG" == "v1.1.0" ]]; then
                # Always include the migration warning in the automatically published release.
                rebrand_notes='IMPORTANT: StandByMode v1.1.0 uses a NEW Android application ID (com.mrbastim.standbymode, previously com.mrbastim.standby.extended). Android installs it as a separate app, NOT an update over StandBy Extended v1.0.6. Settings are NOT migrated. Both apps may coexist; uninstall the old app manually when no longer needed.'
                gh release create "$RELEASE_TAG" standbymode.apk --generate-notes --verify-tag --notes "$rebrand_notes"
              else
                gh release create "$RELEASE_TAG" standbymode.apk --generate-notes --verify-tag
              fi
            fi
          fi

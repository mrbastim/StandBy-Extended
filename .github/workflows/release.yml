name: Build and publish Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository_id == '1457038002' && github.repository_owner == 'mrbastim' && github.actor == 'mrbastim'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Select release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then tag="$INPUT_TAG"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release tags must use vMAJOR.MINOR.PATCH (got $tag)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit comes from main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Record source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and assemble without release secrets
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install APK inspection tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Verify stable APK identity and version progression
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 .github/scripts/check_release_metadata.py --repo "$GH_REPO" --tag "$RELEASE_TAG" --apk app/build/outputs/apk/release/app-release-unsigned.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  smoke:
    needs: build
    uses: ./.github/workflows/release-smoke.yml

  publish:
    needs: [build, smoke]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-apk.yml
    # Explicit forwarding is required even for secrets resolved by the callee's environment.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    with:
      development: false
      release-tag: ${{ needs.build.outputs.tag }}
      target-sha: ${{ needs.build.outputs.sha }}
